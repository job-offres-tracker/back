name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        env:
          # mvnw utilise `set -euf` et référence $MAVEN_DEBUG_OPTS sans la définir ;
          # sans cette valeur par défaut, le script échoue sous sh strict (variable non liée).
          MAVEN_DEBUG_OPTS: ""
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress test
